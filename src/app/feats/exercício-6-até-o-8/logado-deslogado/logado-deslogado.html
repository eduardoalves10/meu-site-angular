<section class="situacao-de-usuario">
    <h2>O usuário está <strong>{{EstadoLogin()}}</strong></h2>
    <div class="usuario">
        @if (EstadoLogin() === "logado") {
        <button class="usuario-deslogado" (click)="deslogar()">Deslogar</button>
        }
        @else {
        <button class="usuario-logado" (click)="logar()">Logar</button>
        }
    </div>
</section>
