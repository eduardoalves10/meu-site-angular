<section class="usuarios">
    <h2>Usuários cadastrados:</h2>

    @for (usuario of usuarios(); track usuario.id) {
        <ul>
            <li>ID de usuário: <strong>{{usuario.id}}</strong>;</li>
            <li>Nome: <strong>{{usuario.nome}}</strong>;</li>
            <li>Idade: <strong>{{usuario.idade}} anos</strong>.</li>
        </ul>
    }
</section>
